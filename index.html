<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Robot 3D</title>
<style>
  :root { --palco:#050814; --dedos:#ffc94d; --luta:#d62828; --botao:#ffffff; --texto-botao:#111; }
  html, body { margin:0; height:100%; background:var(--palco); color:#fff; font-family: system-ui, sans-serif; overflow:hidden; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); opacity:.35; }
  #video.escondido { opacity:0; }
  #tela { position:absolute; inset:0; width:100%; height:100%; }
  #hud { position:absolute; left:16px; right:16px; top:calc(12px + env(safe-area-inset-top, 0px)); display:flex; justify-content:space-between; font-size:30px; font-weight:700; }
  #msg { position:absolute; left:16px; right:16px; top:calc(60px + env(safe-area-inset-top, 0px)); font-size:17px; line-height:1.35; }
  #barra { position:absolute; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
  button { font:inherit; font-size:16px; font-weight:600; border:0; border-radius:14px; padding:13px 16px; background:var(--botao); color:var(--texto-botao); }
  button.sec { background:#2b2b2b; color:#fff; }
  button.jogar { background:var(--luta); color:#fff; }
  button:focus-visible { outline:3px solid var(--dedos); outline-offset:2px; }
  .oculto { display:none; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="tela"></canvas>
<div id="hud"><span id="relogio"></span><span id="placar"></span></div>
<div id="msg">Toque em Ativar câmera e fique de corpo inteiro, a uns 2 metros do celular.</div>
<div id="barra">
  <button id="liga">Ativar câmera</button>
  <button id="modo" class="sec">Modo: Boneco</button>
  <button id="comecar" class="jogar">Começar</button>
  <button id="forca" class="sec">Força: Normal</button>
  <button id="corBtn" class="sec">Cor: Azul</button>
  <button id="fundo" class="sec">Fundo: câmera</button>
</div>

<script type="module">
import { PoseLandmarker, HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const POSE_MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const HAND_MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const $ = id => document.getElementById(id);
const video = $("video"), tela = $("tela"), ctx = tela.getContext("2d");
const msg = $("msg"), liga = $("liga"), fundo = $("fundo"), modoBtn = $("modo");
const comecarBtn = $("comecar"), forcaBtn = $("forca"), relogio = $("relogio"), placar = $("placar");
const corBtn = $("corBtn");

let pose, maos, stream, rodando = false, ultimoTempo = -1;
const MODOS = ["boneco", "luta", "comer"];
const NOMES = { boneco: "Boneco", luta: "Luta", comer: "Comer" };
let modo = "boneco";
const FORCAS = [["Fácil", 2.0], ["Normal", 3.0], ["Difícil", 4.2]];
let forca = 1;

// ---------- cores do robô ----------
const ACENTOS = [["Azul", "#2ea8ff"], ["Vermelho", "#ff3b3b"], ["Amarelo", "#ffc94d"], ["Roxo", "#a855ff"]];
let acento = 0;
const BRANCO = "#e9ecf5", PRETO = "#0a0c14";

// ---------- jogo ----------
const jogo = { estado: "parado", tempo: 30, score: 0, combo: 0, ultimoHit: 0 };
const melhor = { luta: 0, comer: 0 };
try {
  melhor.luta = Number(localStorage.getItem("melhorSoco") || 0);
  melhor.comer = Number(localStorage.getItem("melhorComida") || 0);
} catch (e) {}
const saco = { ang: 0, vel: 0 };
const luvas = [ {id:"E", ids:[15,17,19,21]}, {id:"D", ids:[16,18,20,22]} ];
const textos = [];
const comidas = [];
const punhos = [];
const EMOJIS = ["🍎", "🍌", "🍕", "🍔", "🍇", "🍪", "🍓", "🥕","🎂"];
let proxComida = 0;
let audio;

function som(f) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "square"; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.3, t + 0.12);
    g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(t + 0.15);
  } catch (e) {}
}

// ---------- corpo suavizado ----------
const pts = [];
let maosAtuais = [], maosIdade = 99;
const ok = i => pts[i] && pts[i].miss < 12;

const DEDOS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];

function atualizaPose(res) {
  const lm = res.landmarks && res.landmarks[0];
  if (!lm) { for (const p of pts) if (p) p.miss++; return false; }
  lm.forEach((l, i) => {
    const v = l.visibility == null ? 1 : l.visibility;
    const p = pts[i];
    if (!p) { pts[i] = { x:l.x, y:l.y, z:l.z, v, miss:0 }; return; }
    if (v < 0.35) { p.miss++; p.v = v; return; }
    if (p.miss >= 12) { p.x = l.x; p.y = l.y; p.z = l.z; }
    else { const a = 0.85; p.x += (l.x - p.x) * a; p.y += (l.y - p.y) * a; p.z += (l.z - p.z) * a; }
    p.v = v; p.miss = 0;
  });
  return true;
}

// ---------- tela ----------
function ajustaTela() {
  const d = window.devicePixelRatio || 1;
  tela.width = innerWidth * d; tela.height = innerHeight * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", ajustaTela);
ajustaTela();

function mapa() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const W = innerWidth, H = innerHeight;
  const s = Math.max(W / vw, H / vh);
  const ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  return p => [ox + (1 - p.x) * vw * s, oy + p.y * vh * s];
}
function linha(a, b, cor, larg) {
  ctx.strokeStyle = cor; ctx.lineWidth = larg; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
function ponto(p, cor, r) { ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.fill(); }

// ---------- LUTA: saco de pancada ----------
function geoSaco() {
  const W = innerWidth, H = innerHeight;
  const bw = Math.min(W * 0.14, 70), bh = bw * 1.7;
  const px = W / 2, py = H * 0.03, L = H * 0.36;
  const cx = px + Math.sin(saco.ang) * L, cy = py + Math.cos(saco.ang) * L;
  return { bw, bh, px, py, cx, cy, raio: bw * 1.7 };
}
function desenhaSaco() {
  const g = geoSaco();
  linha([g.px, g.py], [g.cx, g.cy - g.bh], "#bbb", 3);
  ctx.save();
  ctx.translate(g.cx, g.cy); ctx.rotate(saco.ang * 0.6);
  ctx.fillStyle = "#8d5a2b"; ctx.strokeStyle = "#3b2410"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(-g.bw, -g.bh, g.bw * 2, g.bh * 2, g.bw * 0.6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.fillRect(-g.bw, -g.bh * 0.25, g.bw * 2, g.bh * 0.12);
  ctx.fillRect(-g.bw, g.bh * 0.35, g.bw * 2, g.bh * 0.12);
  ctx.restore();
}
function centroLuva(l) {
  if (!ok(l.ids[0])) return null;
  let x = 0, y = 0, z = 0, n = 0;
  for (const i of l.ids) if (ok(i)) { x += pts[i].x; y += pts[i].y; z += pts[i].z; n++; }
  return { x: x / n, y: y / n, z: z / n };
}
function larguraOmbros() {
  if (!ok(11) || !ok(12)) return 0.25;
  return Math.max(0.08, Math.hypot(pts[11].x - pts[12].x, pts[11].y - pts[12].y));
}
function atualizaLuvas(t) {
  const sw = larguraOmbros();
  for (const l of luvas) {
    const c = centroLuva(l);
    if (!c) { l.c = null; l.v = 0; continue; }
    if (l.c && l.t) {
      const dt = (t - l.t) / 1000;
      if (dt > 0.008 && dt < 0.3) {
        const v = Math.hypot(c.x - l.c.x, c.y - l.c.y, c.z - l.c.z) / dt / sw;
        l.v = Math.max(v, (l.v || 0) * 0.6);
      }
    }
    l.c = c; l.t = t;
  }
}
function checaSoco(t, mp) {
  const g = geoSaco();
  const sw = larguraOmbros();
  for (const l of luvas) {
    if (!l.c) continue;
    const p = mp(l.c);
    const rMao = Math.min(70, Math.max(22, sw * innerWidth * 0.2));
    const perto = Math.hypot(p[0] - g.cx, p[1] - g.cy) < g.raio + rMao * 0.6;
    if (perto && l.v > FORCAS[forca][1] && t - (l.hit || 0) > 350) {
      l.hit = t;
      const dir = g.cx >= p[0] ? 1 : -1;
      saco.vel += dir * 3.2 * Math.min(l.v / 3, 1.6);
      som(150 + Math.random() * 40);
      if (navigator.vibrate) navigator.vibrate(25);
      if (jogo.estado === "jogando") {
        jogo.combo = (t - jogo.ultimoHit < 1200) ? jogo.combo + 1 : 1;
        jogo.ultimoHit = t;
        const pontos = 1 + Math.floor(jogo.combo / 5);
        jogo.score += pontos;
        textos.push({ x: g.cx, y: g.cy - g.bh, t, txt: "+" + pontos + (jogo.combo > 1 ? "  x" + jogo.combo : "") });
      }
    }
  }
}

// ---------- COMER: pegar comida com a mão fechada ----------
function calculaPunhos(mp) {
  punhos.length = 0;
  if (maosIdade >= 8) return;
  const asp = video.videoWidth / video.videoHeight;
  const d = (a, b) => Math.hypot((a.x - b.x) * asp, a.y - b.y);
  for (const h of maosAtuais) {
    const palma = d(h[0], h[9]) || 0.01;
    let soma = 0;
    for (const i of [8, 12, 16, 20]) soma += d(h[i], h[0]);
    const razao = soma / 4 / palma;
    let x = 0, y = 0;
    for (const i of [0, 5, 9, 13, 17]) { x += h[i].x; y += h[i].y; }
    punhos.push({ p: mp({ x: x / 5, y: y / 5 }), fechada: razao < 1.4 });
  }
}
function punhoPerto(x, y, raio) {
  let melhorP = null, md = raio;
  for (const h of punhos) {
    if (!h.fechada) continue;
    const dd = Math.hypot(h.p[0] - x, h.p[1] - y);
    if (dd < md) { md = dd; melhorP = h; }
  }
  return melhorP;
}
function posBoca(mp) {
  let r = 60;
  if (ok(7) && ok(8)) {
    const e = mp(pts[7]), d = mp(pts[8]);
    r = Math.max(50, Math.hypot(e[0] - d[0], e[1] - d[1]) * 0.6);
  }
  if (ok(9) && ok(10)) {
    const a = mp(pts[9]), b = mp(pts[10]);
    return { p: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], r };
  }
  if (ok(0)) { const n = mp(pts[0]); return { p: [n[0], n[1] + r * 0.4], r }; }
  return null;
}
function atualizaComidas(dt, t, mp) {
  const W = innerWidth, H = innerHeight;
  proxComida -= dt;
  if (proxComida <= 0) {
    proxComida = 1.1 + Math.random() * 0.8;
    comidas.push({ x: 60 + Math.random() * (W - 120), y: -40, e: EMOJIS[Math.floor(Math.random() * EMOJIS.length)], seg: false, solta: 0 });
  }
  const boca = posBoca(mp);
  if (boca) {
    ctx.setLineDash([6, 8]); ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(boca.p[0], boca.p[1], boca.r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  for (let i = comidas.length - 1; i >= 0; i--) {
    const c = comidas[i];
    if (c.seg) {
      const h = punhoPerto(c.x, c.y, 170);
      if (h) { c.x += (h.p[0] - c.x) * 0.5; c.y += (h.p[1] - c.y) * 0.5; c.solta = 0; }
      else { c.solta++; if (c.solta > 4) c.seg = false; }
    } else {
      c.y += 110 * dt;
      const h = punhoPerto(c.x, c.y, 85);
      if (h) { c.seg = true; c.solta = 0; som(420); }
    }
    if (c.seg && boca && Math.hypot(c.x - boca.p[0], c.y - boca.p[1]) < boca.r) {
      if (jogo.estado === "jogando") { jogo.score++; }
      textos.push({ x: boca.p[0], y: boca.p[1] - boca.r, t, txt: "nham!" });
      som(560);
      if (navigator.vibrate) navigator.vibrate(20);
      comidas.splice(i, 1);
      continue;
    }
    if (c.y > H * 0.9) { comidas.splice(i, 1); continue; }
    ctx.font = (c.seg ? 70 : 56) + "px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(c.e, c.x, c.y);
  }
  for (const h of punhos) {
    ctx.strokeStyle = h.fechada ? "#ffc94d" : "rgba(255,255,255,.35)";
    ctx.lineWidth = h.fechada ? 5 : 2;
    ctx.beginPath(); ctx.arc(h.p[0], h.p[1], h.fechada ? 26 : 18, 0, 7); ctx.stroke();
  }
}

// ---------- ROBÔ (Body Robot 3D) ----------
function luz(c, b) {}
function semLuz() {}
function halo(a, b, c, w) { ctx.globalAlpha = 0.28; linha(a, b, c, w); ctx.globalAlpha = 1; }

// peça de armadura: contorno preto, placa branca e faixa de luz no meio
function peca(a, b, w, ac) {
  linha(a, b, PRETO, w + 7);
  linha(a, b, BRANCO, w);
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const p1 = [a[0] + dx * 0.25, a[1] + dy * 0.25], p2 = [a[0] + dx * 0.75, a[1] + dy * 0.75];
  halo(p1, p2, ac, Math.max(5, w * 0.34));
  linha(p1, p2, ac, Math.max(2, w * 0.13));
}
// junta preta com anel de luz
function junta(p, r, ac) {
  ponto(p, PRETO, r);
  ctx.save(); luz(ac, 10);
  ctx.strokeStyle = ac; ctx.lineWidth = Math.max(2, r * 0.22);
  ctx.beginPath(); ctx.arc(p[0], p[1], r * 0.62, 0, 7); ctx.stroke();
  ctx.restore();
}
function poligono(lista, preench, borda, larg) {
  ctx.beginPath();
  lista.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  if (preench) { ctx.fillStyle = preench; ctx.fill(); }
  if (borda) { ctx.strokeStyle = borda; ctx.lineWidth = larg; ctx.lineJoin = "round"; ctx.stroke(); }
}
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

function desenhaPerna(mp, q, j, t, c, s, ac) {
  // q = quadril, j = joelho, t = tornozelo, c = calcanhar, c + 2 = ponta do pé
  if (ok(q) && ok(j)) peca(mp(pts[q]), mp(pts[j]), s * 0.36, ac);
  if (ok(j) && ok(t)) peca(mp(pts[j]), mp(pts[t]), s * 0.28, ac);
  if (ok(j)) junta(mp(pts[j]), s * 0.19, ac);
  if (ok(t) && ok(c) && ok(c + 2)) {
    const tor = mp(pts[t]), cal = mp(pts[c]), pon = mp(pts[c + 2]);
    peca(cal, pon, s * 0.26, ac);
    junta(tor, s * 0.12, ac);
  }
}
function desenhaBraco(mp, o, co, pu, s, ac) {
  if (ok(o) && ok(co)) peca(mp(pts[o]), mp(pts[co]), s * 0.26, ac);
  if (ok(co) && ok(pu)) peca(mp(pts[co]), mp(pts[pu]), s * 0.2, ac);
  if (ok(co)) junta(mp(pts[co]), s * 0.15, ac);
  if (ok(o)) {
    const p = mp(pts[o]);
    ponto(p, PRETO, s * 0.3);
    ponto(p, BRANCO, s * 0.25);
    ctx.save(); luz(ac, 8);
    ctx.strokeStyle = ac; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p[0], p[1], s * 0.17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.restore();
  }
  if (ok(pu)) junta(mp(pts[pu]), s * 0.11, ac);
}

function desenhaTorso(mp, s, ac) {
  if (!(ok(11) && ok(12) && ok(23) && ok(24))) return;
  const sL = mp(pts[11]), sR = mp(pts[12]), hL = mp(pts[23]), hR = mp(pts[24]);
  const ms = mix(sL, sR, 0.5), mh = mix(hL, hR, 0.5);
  // pescoço
  linha(ms, mix(ms, mh, -0.12), PRETO, s * 0.22);
  // corpo escuro (barriga com gomos)
  poligono([sL, sR, hR, hL], PRETO, PRETO, 6);
  // gomos do abdômen
  ctx.save(); luz(ac, 8);
  for (let k = 0; k < 3; k++) {
    const t = 0.55 + k * 0.13;
    linha(mix(mix(sL, hL, t), mix(sR, hR, t), 0.3), mix(mix(sL, hL, t), mix(sR, hR, t), 0.7), ac, 2);
  }
  ctx.restore();
  // peitoral branco
  const cL = mix(sL, hL, 0.5), cR = mix(sR, hR, 0.5);
  const iL = mix(cL, cR, 0.08), iR = mix(cL, cR, 0.92);
  poligono([mix(sL, sR, 0.04), mix(sL, sR, 0.96), iR, iL], BRANCO, PRETO, 4);
  // linhas de luz laterais do peito
  ctx.save(); luz(ac, 10);
  linha(mix(sL, sR, 0.14), mix(iL, iR, 0.14), ac, 2.5);
  linha(mix(sL, sR, 0.86), mix(iL, iR, 0.86), ac, 2.5);
  ctx.restore();
  // núcleo hexagonal brilhante
  const c = mix(ms, mh, 0.2), r = s * 0.2;
  const hex = [];
  for (let i = 0; i < 6; i++) hex.push([c[0] + Math.cos(i * Math.PI / 3 + Math.PI / 6) * r, c[1] + Math.sin(i * Math.PI / 3 + Math.PI / 6) * r]);
  ctx.save(); luz(ac, 22);
  poligono(hex, PRETO, ac, 3);
  ctx.restore();
  ctx.globalAlpha = 0.3; ponto(c, ac, r * 1.5); ctx.globalAlpha = 1;
  ponto(c, "#ffffff", r * 0.4);
  ctx.save(); luz(ac, 14); ponto(c, ac, r * 0.28); ctx.restore();
  // cinto / pélvis
  peca(hL, hR, s * 0.28, ac);
  // placa entre as pernas
  poligono([mix(hL, hR, 0.3), mix(hL, hR, 0.7), mix(mix(hL, hR, 0.62), [mh[0], mh[1] + s * 0.32], 0.9), mix(mix(hL, hR, 0.38), [mh[0], mh[1] + s * 0.32], 0.9)], BRANCO, PRETO, 3);
}

function desenhaCabeca(mp, s, ac) {
  if (!(ok(7) && ok(8))) return;
  let e = mp(pts[7]), d = mp(pts[8]);
  if (e[0] > d[0]) [e, d] = [d, e];
  const cx = (e[0] + d[0]) / 2, cy = (e[1] + d[1]) / 2;
  const larg = Math.hypot(d[0] - e[0], d[1] - e[1]);
  const rw = Math.max(18, larg * 0.75), rh = rw * 1.25;
  const ang = Math.atan2(d[1] - e[1], d[0] - e[0]);
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(ang);
  // capacete
  ctx.fillStyle = BRANCO; ctx.strokeStyle = PRETO; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(0, 0, rw, rh, 0, 0, 7); ctx.fill(); ctx.stroke();
  // faixa central do capacete
  ctx.fillStyle = "#b8c0d4";
  ctx.beginPath(); ctx.ellipse(0, -rh * 0.55, rw * 0.22, rh * 0.38, 0, 0, 7); ctx.fill();
  // visor preto
  ctx.fillStyle = PRETO;
  ctx.beginPath(); ctx.ellipse(0, rh * 0.12, rw * 0.8, rh * 0.62, 0, 0, 7); ctx.fill();
  // olhos de luz inclinados
  ctx.save(); luz(ac, 16);
  halo([-rw * 0.62, -rh * 0.02], [-rw * 0.14, rh * 0.14], ac, rh * 0.3);
  halo([rw * 0.62, -rh * 0.02], [rw * 0.14, rh * 0.14], ac, rh * 0.3);
  linha([-rw * 0.62, -rh * 0.02], [-rw * 0.14, rh * 0.14], ac, rh * 0.13);
  linha([rw * 0.62, -rh * 0.02], [rw * 0.14, rh * 0.14], ac, rh * 0.13);
  ctx.restore();
  // fones laterais
  for (const lado of [-1, 1]) {
    ctx.fillStyle = BRANCO; ctx.strokeStyle = PRETO; ctx.lineWidth = 3;

function desenhaMaos(mp, s, ac) {
